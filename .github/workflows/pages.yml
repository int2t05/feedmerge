name: Daily digest and Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '13 0 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '北京时间日期 YYYY-MM-DD，留空使用昨天'
        type: string
      refresh:
        description: '重新采集指定日期'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: feedmerge-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: npm ci
      - name: 生成每日简报
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HISTORY_URL: ${{ steps.pages.outputs.base_url }}/archive-data.json
          DIGEST_DATE: ${{ inputs.date }}
          REFRESH: ${{ inputs.refresh }}
        run: |
          args=(--history-url "$HISTORY_URL")
          if [[ -n "$DIGEST_DATE" ]]; then args+=(--date "$DIGEST_DATE"); fi
          if [[ "$REFRESH" == 'true' ]]; then args+=(--refresh); fi
          python -m feedmerge "${args[@]}"
      - name: 构建 VitePress
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: BASE_PATH="${PAGES_BASE%/}/" npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/.vitepress/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
